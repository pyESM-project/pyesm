log_level: 'info'

# Default method settings (applied to all models unless overridden)
methods:
    refresh_database_and_initialize_problem: {force_overwrite: True}
    run_model: {force_overwrite: True}
    load_results_to_database: {force_overwrite: True}
    check_model_results: {}

# Model-specific method overrides
model_overrides:
    production_planning:
        run_model: {
            force_overwrite: True, 
        }
    production_planning_decomposition:
        run_model: {
            force_overwrite: True, 
            solution_mode: 'integrated',
            convergence_monitoring: False,
        }
    production_planning_nonlinear:
        run_model: {
            force_overwrite: True, 
            solver: 'IPOPT',
            solver_settings: {'nlp': True},
        }
    production_planning_sequential:
        run_model: {
            force_overwrite: True, 
            solution_mode: 'sequential',
            sequential_solution_chain: ['data_calibration', 'planning_model'],
        }